---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
  labels:
    type: Webserver
spec:
  replicas: 2
  selector:
    matchLabels:
      type: webserver
  template:
    metadata:
      name: nginx-pod
      labels:
        type: webserver
    spec:
      containers:
        - name: nginx
          image: nginx
      tolerations:
        - key: worker2
          value: chaitanya
          operator: Equal
          effect: NoSchedule
...
